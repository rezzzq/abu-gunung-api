name: Update data and deploy

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs by a few minutes under load.
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: ruff check scripts tests/python && ruff format --check scripts tests/python
      - run: pytest -q
      - name: Fetch latest advisory data
        run: npm run fetch
      - name: Render Himawari-9 Ash RGB
        run: python scripts/ash_rgb.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "chore: refresh ash advisory data"
            git push
          fi
      - run: npm run build
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27 deploy --prod --dir=dist --message "GitHub Actions ${{ github.sha }}"
