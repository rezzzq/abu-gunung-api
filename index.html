<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sebaran Abu Gunung Api</title>
    <meta name="description" content="Peta langsung sebaran abu vulkanik gunung api Indonesia: area abu saat ini dan perkiraan 6, 12, 18 jam ke depan, citra satelit, dan arah angin." />
    <meta name="theme-color" content="#00253f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sebaran Abu Gunung Api" />
    <meta property="og:description" content="Peta langsung sebaran abu vulkanik gunung api Indonesia, diperbarui otomatis dari VAAC Darwin dan PVMBG." />
    <meta property="og:image" content="./og.png" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
    />
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <script>
      // Set the theme before the first paint so the page does not flash white. Mirrors src/lib/theme.ts.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("krakatau.theme");
        } catch (e) {
          // Storage can be blocked; fall through to the system setting.
        }
        var dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="map" role="application" aria-label="Peta sebaran abu"></div>

    <header class="topbar">
      <div class="topbar__title">
        <span class="topbar__mark" aria-hidden="true"></span>
        <div>
          <h1 id="title">Sebaran Abu Gunung Api</h1>
          <p id="freshness" class="freshness" aria-live="polite"></p>
        </div>
      </div>
    </header>

    <div id="banner" class="banner" hidden>
      <span id="banner-text"></span>
      <button id="banner-retry" type="button"></button>
    </div>

    <div class="map-controls" role="group">
      <button id="toggle-sat" class="ctl" type="button" aria-pressed="false" aria-haspopup="menu" aria-expanded="false" aria-controls="sat-menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0Zm2.2 0a6.8 6.8 0 1 1 13.6 0 6.8 6.8 0 0 1-13.6 0Zm4-1.3a3 3 0 1 1 5.6 2.6 3 3 0 0 1-5.6-2.6Z"/></svg>
        <span id="sat-tag" class="ctl__tag" hidden></span>
      </button>
      <div id="sat-menu" class="menu" role="menu" hidden></div>
      <button id="toggle-wind" class="ctl" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h10.5a2.5 2.5 0 1 0-2.3-3.5M3 12h15a3 3 0 1 1-2.8 4M3 16h8.5a2 2 0 1 1-1.9 2.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="locate" class="ctl" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3m0 14v3M2 12h3m14 0h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.2"/></svg>
      </button>
    </div>

    <div class="legend" aria-label="Keterangan">
      <div id="legend"></div>
      <div id="legend-sat"></div>
    </div>

    <div class="dock">
      <section id="sheet" class="sheet sheet--collapsed" aria-label="Rincian">
        <button id="sheet-handle" class="sheet__handle" type="button" aria-expanded="false">
          <span class="sheet__grip" aria-hidden="true"></span>
        </button>
        <div id="volcano-strip" class="vchips" role="tablist" hidden></div>
        <div id="time-chips" class="segments" role="tablist"></div>
        <div class="sheet__peek">
          <div id="status" class="status"></div>
          <div id="peek-legend" class="peek-legend" aria-label="Keterangan"></div>
          <div id="peek-sat" class="peek-legend"></div>
        </div>
        <div class="sheet__scroll">
          <div class="sheet__body">
            <div id="step-info" class="step-info"></div>
            <section class="card card--location">
              <button id="check-location" class="btn btn--primary" type="button"></button>
              <p id="location-result" class="location-result" aria-live="polite"></p>
            </section>
            <section class="card" id="airports-card"></section>
            <section class="card" id="wind-card" aria-live="polite"></section>
            <section class="card" id="status-detail"></section>
            <section class="card" id="safety"></section>
            <section class="card" id="links"></section>
            <div class="prefs">
              <button id="toggle-theme" class="pref" type="button" aria-pressed="false"></button>
              <button id="lang" class="pref" type="button" lang="en"></button>
            </div>
            <button id="share" class="btn btn--ghost" type="button"></button>
            <footer class="footer" id="footer"></footer>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
