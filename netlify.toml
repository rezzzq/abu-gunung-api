[build]
  command = "npm run fetch && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Scheduled function that starts the GitHub Actions refresh; see netlify/functions/trigger-refresh.mts.
[functions]
  directory = "netlify/functions"

# The data file changes every 15 minutes; browsers must always revalidate it.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
